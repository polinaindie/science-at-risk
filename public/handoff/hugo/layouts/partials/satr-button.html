{{/* Squircle button. Source of truth: src/components/Button. Needs css/satr-components.css (+ satr-chrome.css) and js/satr-shape.js.
     Params: label (string), variant ("black" | "white" | "bordered"), danger (bool, bordered only), disabled (bool). */}}
<button type="button" class="satr-squircle satr-squircle--{{ .variant }}{{ if .danger }} satr-squircle--danger{{ end }}" data-squircle="bg"{{ if eq .variant "bordered" }} data-ring="2"{{ end }}{{ if .disabled }} disabled{{ end }}><span class="satr-squircle__bg" aria-hidden="true"></span>{{ .label }}</button>
