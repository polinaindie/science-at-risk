<h1 class="title">Log in</h1>
<div class="notice" role="status"><p>Password saved. Log in with it.</p></div><form method="post" action="/login/password" novalidate data-demo-next="account.html"><input type="hidden" name="_csrf" value="csrf-token">

<div class="field ">
<label for="ln-email">Email <span class="req" aria-hidden="true">*</span></label>
<input id="ln-email" name="email" aria-required="true" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" type="email" value="">

</div>
<div class="field field--reveal">
<label for="ln-pass">Password <span class="req" aria-hidden="true">*</span></label>
<input id="ln-pass" name="password" aria-required="true" autocomplete="current-password" spellcheck="false" type="password" value=""><button type="button" class="reveal" data-reveal aria-controls="ln-pass" aria-pressed="false" data-show="Show" data-hide="Hide" hidden>Show</button>

</div>
<button class="btn btn--block " type="submit">Log in</button>
</form><p class="row"><a class="link" href="reset-request.html">Forgot password?</a></p>
