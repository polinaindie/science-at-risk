<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Choose a new password — Science At Risk</title>
<link rel="alternate" hreflang="uk" href="uk/reset-new-password.html">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="cabinet.css">
<script src="cabinet.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="hdr"><div class="hdr__in">
<a class="hdr__logo" href="/" aria-label="Science At Risk">SC!ENCE AT R!SK!</a>
<nav class="lang" aria-label="Language"><span lang="en" aria-current="true">ENG</span><span aria-hidden="true">/</span><a lang="uk" hreflang="uk" href="uk/reset-new-password.html">УКР</a></nav>
</div></header>
<main id="main" class="wrap wrap--narrow" tabindex="-1">
<h1 class="title">Choose a new password</h1>
<p class="lede">Choose a password you will use from now on.</p><form method="post" action="/password/reset/TOKEN" novalidate data-demo-next="login-notice.html"><input type="hidden" name="_csrf" value="csrf-token">

<div class="field field--reveal">
<label for="rn-pass">New password <span class="req" aria-hidden="true">*</span></label>
<input id="rn-pass" name="password" aria-required="true" autocomplete="new-password" spellcheck="false" minlength="10" type="password" value=""><button type="button" class="reveal" data-reveal aria-controls="rn-pass" aria-pressed="false" data-show="Show" data-hide="Hide" hidden>Show</button>

</div>
<div class="rules"><p id="rn-rules">The password needs:</p><ul aria-labelledby="rn-rules"><li>at least 10 characters</li><li>a letter</li><li>a digit</li></ul></div>
<div class="field field--reveal">
<label for="rn-rep">Repeat the password <span class="req" aria-hidden="true">*</span></label>
<input id="rn-rep" name="password_repeat" aria-required="true" autocomplete="new-password" spellcheck="false" type="password" value=""><button type="button" class="reveal" data-reveal aria-controls="rn-rep" aria-pressed="false" data-show="Show" data-hide="Hide" hidden>Show</button>

</div>
<button class="btn btn--block " type="submit">Save new password</button>
</form>
</main>
<footer class="ftr"><div class="ftr__in"><p>Science At Risk! Help for Ukrainian scientists affected by the war.</p><p data-handoff-only><a href="index.html">Map of screens</a></p></div></footer>
</body>
</html>
