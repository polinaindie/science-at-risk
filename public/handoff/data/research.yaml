  en:
    slug: "impact-of-the-war-on-different-categories-of-ukrainian-scholars"
    translationKey: "research-impact-of-the-war"
    title: "Impact of the War on Different Categories of Ukrainian Scholars"
    theme: "scientists"
    authors: "Olena Kozak, Lidia Kuzemska, Yevheniia Polishchuk, Kateryna Chuyeva"
    summary: "The war has caused significant damage to Ukraine’s research ecosystem. Scholars face a complex set of interconnected challenges, including security risks, forced displacement, loss of income, the destruction of laboratories, limited access to equipment, and psychological strain.Ukrainian researchers are currently under extraordinary pressure, in circumstances where basic survival needs overshadow academic priorities. Without intervention, Ukraine risks the long-term erosion of its research capacity."
    key_findings:
      - title: "Basic needs outweigh academic needs."
        text: "Financial stability, personal and family safety, housing, and mental health have become more urgent than access to laboratories, academic mobility, or professional development. Support should therefore focus first on reducing everyday stress and uncertainty, including through housing programmes, psychological assistance, and regular access to information."
      - title: "Financial instability is the primary systemic threat."
        text: "Ninety per cent of surveyed scholars reported a need for higher salaries and increased research funding, **64%** are seeking additional sources of income, and **34%** have experienced reductions in research funding. Preserving Ukraine’s research workforce requires competitive salaries, transparent funding mechanisms, and simplified taxation rules for international grants."
      - title: "The war has severely damaged research infrastructure and restricted academic mobility."
        text: "**46%** of respondents reported limited access to laboratories and research facilities, while **27%** reported restricted access to materials and sources. Priority measures should include restoring and modernising infrastructure, developing shared interdisciplinary hubs, and creating flexible mobility mechanisms that allow scholars to maintain ties with Ukrainian institutions."
      - title: "The academic community is marked by imbalances and inequalities."
        text: "Scholars who have remained in Ukraine often take on additional workloads without adequate compensation, while displaced researchers, particularly women, face employment insecurity. Fair workload distribution and career development opportunities must be ensured, while excessive bureaucratic and formal requirements should be eased."
      - title: "The displacement of large numbers of scholars may cause significant long-term harm to Ukrainian academia."
        text: "The state should develop mechanisms to prevent brain drain and enable scholars who work and/or live abroad to maintain close ties with Ukrainian institutions. Team-based reintegration mechanisms for returnees would encourage more scholars to return and re-engage with the academic community."
      - title: "Scholar-veterans face distinct challenges when returning to academic work."
        text: "More than 1,500 Ukrainian scholars have served or are currently serving in the Defence Forces of Ukraine since 2022. Their reintegration requires flexible mechanisms that respond to individual circumstances, time for physical and psychological recovery, opportunities to refresh professional skills, reduced formal barriers, financial support, and long-term access to mental health services."
    body: |-
      This White Paper provides a comprehensive, evidence-based analysis of how Russia’s full-scale invasion has transformed the living conditions, professional trajectories, and institutional affiliations of Ukrainian scholars. Drawing on desk research, online surveys, focus groups, and additional qualitative data sources, the authors propose a structured typology of scholars at risk and identify the specific challenges and needs associated with different scientific fields, career stages, displacement experiences, veteran status, and affiliation patterns.

      The authors formulate six key findings and corresponding areas for action:

      Implementing the measures proposed in this White Paper will require coordinated action by the government, relevant ministries, research funding bodies, universities and research institutions, local authorities, international donors, professional associations, civil society organisations, and veteran organisations.

      The findings can provide a foundation for differentiated support programmes, legislative changes, and advocacy campaigns aimed at preserving Ukraine’s scientific potential, reducing the loss of human capital, and enabling scholars — regardless of their location or affiliation — to contribute to national resilience, post-war recovery, and European integration.
    pdf: "storage/lp/232/b581142239792c5efada46ef777498298292dedb.pdf"
    new: true
