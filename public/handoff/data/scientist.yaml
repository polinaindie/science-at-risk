    research_area: |-
      Igor's research group focuses on biologically active peptides in close collaboration with the Karlsruhe Institute of Technology, namely*: *development and synthesis of 19F-substituted amino acids as 19F-NMR labels for incorporation into membrane-active peptides and their further structural research in biomembranes by solid-state 19F-NMR; creation of peptidomimetics, the biological activity of which can be controlled with the help of light.

      For example, the first photocontrolled cyclic peptide based on diarylethene initiated a new class of compounds whose biological activity and toxicity can be «turned on» and «turned off» by visible light in living organisms.

      Igor's previous research was related to using conformationally constrained molecules in organic and medicinal chemistry and structural biology. Conformationally constrained molecular tools, examples of which are given below, have made it possible to read, manipulate, and interfere with biological information processing.
    duties: "Igor leads the Institute of High Technologies of Taras Shevchenko Kyiv National University and participates in forming the university's scientific policy. He is a member of the expert council of the Ministry of Education and Science of Ukraine, which examines scientific projects, a reviewer for RSC Advances, Royal Society of Chemistry (Great Britain), and a member of the scientific society AMPERE SOCIETY."
