        citation_as_printed: "Stephan L. Grage, Marc-Antoine Sani, Olivier Cheneval, SóniaTroeiraHenriques, Constantin Schalck, Ralf Heinzmann, Joshua S. Mylne, Pavel K. Mykhailiuk, SergiiAfonin, Igor V. Komarov, Frances Separovic, David J. Craik, Anne S. Ulrich. Biophys. J., 112, 630–642, 2017."
