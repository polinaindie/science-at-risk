    short_name: "Institute for Problems of Cryobiology and Cryomedicine"
    full_name: ""
    body: |-
      [The ](instytut-problem-kriobiolohii-i-kriomedytsyny.html)Institute conducts fundamental and applied research in the following areas: a study of the mechanisms of cryo-damage, cryoprotection, the natural resistance of biological objects to cold and their repair after exposure to cold; creation of effective methods of artificial cryoprotection of biological systems of different levels of the organization and, on their basis, development of technologies for cryopreservation of physical objects and technical means of their implementation; use of hypothermia, cryotherapy, and cryopreserved physical objects in the treatment of various diseases; cell, and tissue.

      The hostilities damaged the double-glazed windows and soft roofs in the administrative and laboratory building, the boiler room, and the water supply system.
