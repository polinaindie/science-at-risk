<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in with a password — Science At Risk</title>
<link rel="alternate" hreflang="uk" href="uk/login-password.html">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="cabinet.css">
<script src="cabinet.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="hdr"><div class="hdr__in">
<a class="hdr__logo" href="/" aria-label="Science At Risk">SC!ENCE AT R!SK!</a>
<nav class="lang" aria-label="Language"><span lang="en" aria-current="true">ENG</span><span aria-hidden="true">/</span><a lang="uk" hreflang="uk" href="uk/login-password.html">УКР</a></nav>
</div></header>
<main id="main" class="wrap wrap--narrow" tabindex="-1">
<h1 class="title">Log in with a password</h1>
<p class="lede">Enter the email and the password you chose for the cabinet.</p><form method="post" action="/login/password" novalidate data-demo-next="account.html"><input type="hidden" name="_csrf" value="csrf-token">

<div class="field ">
<label for="pw-email">Email <span class="req" aria-hidden="true">*</span></label>
<input id="pw-email" name="email" aria-required="true" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" type="email" value="">

</div>
<div class="field field--reveal">
<label for="pw-pass">Password <span class="req" aria-hidden="true">*</span></label>
<input id="pw-pass" name="password" aria-required="true" autocomplete="current-password" spellcheck="false" type="password" value=""><button type="button" class="reveal" data-reveal aria-controls="pw-pass" aria-pressed="false" data-show="Show" data-hide="Hide" hidden>Show</button>

</div>
<button class="btn btn--block " type="submit">Log in</button>
</form>
<p class="row"><a class="link" href="reset-request.html">Forgot password?</a></p><p><a class="link" href="login.html">Get a code by email instead</a></p>
</main>
<footer class="ftr"><div class="ftr__in"><p>Science At Risk! Help for Ukrainian scientists affected by the war.</p><p data-handoff-only><a href="index.html">Map of screens</a></p></div></footer>
</body>
</html>
