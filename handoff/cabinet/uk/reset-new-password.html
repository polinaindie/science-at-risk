<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Новий пароль — Science At Risk</title>
<link rel="alternate" hreflang="en" href="../reset-new-password.html">
<link rel="stylesheet" href="../../../css/tokens.css"><link rel="stylesheet" href="../../../css/type-scale.css">
<link rel="stylesheet" href="../cabinet.css">
<script src="../cabinet.js" defer></script>
<script src="../demo.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Перейти до змісту</a>
<header class="hdr"><div class="hdr__in">
<a class="hdr__logo" href="/" aria-label="Science At Risk">SC!ENCE AT R!SK!</a>
<nav class="lang" aria-label="Мова"><a lang="en" hreflang="en" href="../reset-new-password.html">ENG</a><span aria-hidden="true">/</span><span lang="uk" aria-current="true">УКР</span></nav>
</div></header>
<main id="main" class="wrap wrap--narrow" tabindex="-1">
<h1 class="title">Новий пароль</h1>
<p class="lede">Придумайте пароль, яким користуватиметесь надалі.</p><form method="post" action="/password/reset/TOKEN" novalidate data-demo-next="login-notice.html"><input type="hidden" name="_csrf" value="csrf-token">

<div class="field field--reveal">
<label for="rn-pass">Новий пароль <span class="req" aria-hidden="true">*</span></label>
<input id="rn-pass" name="password" aria-required="true" autocomplete="new-password" spellcheck="false" minlength="10" type="password" value=""><button type="button" class="reveal" data-reveal aria-controls="rn-pass" aria-pressed="false" data-show="Показати" data-hide="Сховати" hidden>Показати</button>

</div>
<div class="rules"><p id="rn-rules">У паролі має бути:</p><ul aria-labelledby="rn-rules"><li>щонайменше 10 символів</li><li>літера</li><li>цифра</li></ul></div>
<div class="field field--reveal">
<label for="rn-rep">Повторіть пароль <span class="req" aria-hidden="true">*</span></label>
<input id="rn-rep" name="password_repeat" aria-required="true" autocomplete="new-password" spellcheck="false" type="password" value=""><button type="button" class="reveal" data-reveal aria-controls="rn-rep" aria-pressed="false" data-show="Показати" data-hide="Сховати" hidden>Показати</button>

</div>
<button class="btn btn--block " type="submit">Зберегти новий пароль</button>
</form>
</main>
<footer class="ftr"><div class="ftr__in"><p>Science At Risk! Допомога українським вченим, які постраждали від війни.</p><p data-handoff-only><a href="index.html">Мапа екранів</a></p></div></footer>
</body>
</html>
