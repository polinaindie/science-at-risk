# Builds the site and Storybook and publishes both to GitHub Pages:
#   /science-at-risk/            the site
#   /science-at-risk/storybook/  the component library
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /science-at-risk/
      STORYBOOK_BASE: /science-at-risk/storybook/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir dist/storybook

      # A project page serves files, not routes: a deep link like /experts is a
      # 404 until the server hands back the app. GitHub Pages serves 404.html
      # for anything it cannot find, so the app itself becomes that fallback.
      - name: Add the SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
